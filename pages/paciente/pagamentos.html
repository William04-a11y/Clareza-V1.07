<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamentos — Clareza</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/reset.css" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/layout.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body data-layout="app" data-role="paciente" data-active="pagamentos" data-page-title="Pagamentos" data-base="../../">

  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div id="navbarSlot"></div>

    <main class="app-main">
      <div style="margin-bottom: var(--space-6);">
        <span class="eyebrow">Situação financeira</span>
        <h2 style="margin-top: var(--space-1);">Pagamentos</h2>
      </div>

      <div class="grid grid-3" id="pagamentosSummary" style="margin-bottom: var(--space-6);"></div>

      <div class="toolbar">
        <button type="button" class="filter-chip is-active" data-status-filter="todos">Todos</button>
        <button type="button" class="filter-chip" data-status-filter="pago">Pago</button>
        <button type="button" class="filter-chip" data-status-filter="pendente">Pendente</button>
        <button type="button" class="filter-chip" data-status-filter="atrasado">Atrasado</button>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Consulta</th>
              <th>Data</th>
              <th>Valor</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="pagamentosTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal: comprovante de pagamento -->
  <div class="modal-backdrop" id="modalComprovante" data-modal>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalComprovanteTitle">
      <div class="modal__header">
        <h2 class="modal__title" id="modalComprovanteTitle">Comprovante</h2>
        <button class="modal__close" data-modal-close aria-label="Fechar">&times;</button>
      </div>
      <div class="modal__body" id="modalComprovanteBody"></div>
      <div class="modal__footer">
        <button class="btn btn--secondary" data-modal-close>Fechar</button>
      </div>
    </div>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="../../components/navbar.js"></script>
  <script src="../../components/sidebar.js"></script>
  <script src="../../components/footer.js"></script>
  <script src="../../components/card.js"></script>
  <script src="../../components/alert.js"></script>
  <script src="../../components/modal.js"></script>
  <script src="../../js/navigation.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/modal.js"></script>
  <script src="../../js/dropdown.js"></script>
  <script src="../../js/mock-data-paciente.js"></script>
  <script src="../../js/pagamentos-paciente.js"></script>
  <script src="../../js/main.js"></script>
</body>
</html>
